name: Update AI News Snapshot

on:
  workflow_dispatch:
    inputs:
      force_tikhub:
        description: "Force a paid TikHub refresh even before its normal interval"
        required: false
        default: false
        type: boolean
  schedule:
    # 每小时一次（UTC 整点，即北京时间每个整点）。公开仓库 Actions 免费，无分钟数限制。
    - cron: "0 * * * *"

concurrency:
  group: update-ai-news-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare OPML
        env:
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          mkdir -p feeds
          if [ -f feeds/follow.opml ]; then
            echo "Using committed feeds/follow.opml from repo"
          elif [ -n "$FOLLOW_OPML_B64" ]; then
            echo "$FOLLOW_OPML_B64" | base64 --decode > feeds/follow.opml
            echo "Loaded feeds/follow.opml from FOLLOW_OPML_B64 secret"
          elif [ -f feeds/follow.example.opml ]; then
            cp feeds/follow.example.opml feeds/follow.opml
            echo "Loaded public demo OPML from feeds/follow.example.opml"
          else
            echo "No OPML file available; RSS OPML is optional"
          fi

      - name: Update data
        env:
          # 2026-09-11 清理死引用：付费源（X / SocialData / TikHub）、邮件摘要
          # （AgentMail）、上游 LLM 增强（DeepSeek）均未启用，对应 secret/vars
          # 全为空（仓库零 secrets 红线），这些 env 引用等价死代码。代码侧一律
          # `os.environ.get(...) or default`，对空值与未设置行为一致，删后不变。
          # 将来若要启用某源：在此恢复对应 env 引用，并在 GitHub 侧配置 secret。
          RSS_MAX_FEEDS: ${{ vars.RSS_MAX_FEEDS || 30 }}
        run: |
          if [ -f feeds/follow.opml ]; then
            python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 21 --rss-opml feeds/follow.opml --rss-max-feeds "${RSS_MAX_FEEDS:-30}"
          else
            python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 21
          fi

      - name: Persona scoring
        # 无 DeepSeek key：脚本走规则兜底（mode=rules_fallback），退出码 0。
        run: python scripts/persona_score.py --data-dir data

      - name: Post-process (daily-brief + stories-merged)
        run: python scripts/post_process_radar.py --data-dir data

      - name: Classify items into categories
        run: python scripts/classify_items.py --data-dir data

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage the whole data dir so newly added output files can never be
          # silently dropped again (the daily-brief/stories-merged freeze was
          # caused by a stale filename whitelist here). .gitignore keeps
          # data/email-digest.json out of this add.
          git add data/
          if [ -f data/email-digest.json ] && [ "$EMAIL_DIGEST_PUBLISH" = "1" ]; then
            git add -f data/email-digest.json
          fi
          # Self-check: fail loudly if anything under data/ is still unstaged,
          # instead of green-but-stale runs.
          if [ -n "$(git status --porcelain --untracked-files=all -- data/ | grep -v '^[MADRC]' || true)" ]; then
            echo "::error::Generated files under data/ were not staged:"
            git status --porcelain --untracked-files=all -- data/ | grep -v '^[MADRC]'
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update ai news snapshot"
          # 运行期间有人推了同分支时裸 push 会被拒(non-fast-forward),整轮数据白跑。
          # rebase 到最新远端再推,最多重试 3 次;数据文件都是本轮生成的快照,rebase 无冲突风险。
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt), rebasing onto latest remote..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; exit 1; }
          done
          git push
